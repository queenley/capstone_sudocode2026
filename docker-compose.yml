# Shared by every way of running the stack; publishes no port of its own.
#   Local (this machine):  docker compose up -d --build
#       also reads docker-compose.override.yml: ports on 127.0.0.1, dev defaults.
#   Cloud (one server):    docker compose -f docker-compose.yml -f infra/compose/docker-compose.cloud.yml up -d --build
#       HTTPS on DOMAIN through Caddy, secrets required, cloud voice, ASR on a GPU host.
# The cloud files (compose override, .env template, Caddy) are in infra/compose/;
# details: docs/deployment/README.md ("Docker Compose").
name: telesales-ai
x-runtime: &runtime
  build:
    context: .
    dockerfile: packages/backend-common/Dockerfile
  environment: &environment
    DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-local-postgres-change-me}@postgres:5432/app_db
    REDIS_URL: redis://redis:6379/0
    APP_SECRET: ${APP_SECRET:-local-development-secret-change-before-deploy}
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    ENVIRONMENT: ${ENVIRONMENT:-development}
    ADMIN_TOKEN: ${ADMIN_TOKEN:-local-admin-change-me}
    AGENT_TOKEN: ${AGENT_TOKEN:-local-agent-change-me}
    SELLER_TOKEN: ${SELLER_TOKEN:-local-seller-change-me}
    DEVELOPER_TOKEN: ${DEVELOPER_TOKEN:-local-developer-change-me}
    TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
    JEV_URL: ${JEV_URL:-https://api.typesafe.ai/v1/systemone}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_URL: ${LLM_URL:-}
    LLM_MODEL: ${LLM_MODEL:-}
    OTP_DELIVERY_URL: ${OTP_DELIVERY_URL:-}
    OTP_DELIVERY_TOKEN: ${OTP_DELIVERY_TOKEN:-}
    KAFKA_BROKERS: ${KAFKA_BROKERS:-}
    KAFKA_LEGACY_TOPIC_MIRROR: ${KAFKA_LEGACY_TOPIC_MIRROR:-true}
    QDRANT_URL: ${QDRANT_URL:-}
    QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    EMBEDDING_URL: ${EMBEDDING_URL:-}
    EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    # The shop's bank account for transfer payments (VietQR); empty: COD only.
    BANK_BIN: ${BANK_BIN:-}
    BANK_NAME: ${BANK_NAME:-}
    BANK_ACCOUNT_NO: ${BANK_ACCOUNT_NO:-}
    BANK_ACCOUNT_NAME: ${BANK_ACCOUNT_NAME:-}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-change-me}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  seed:
    <<: *runtime
    command: ["python", "-m", "scripts.seed.catalog", "--dataset", "/app/data", "--btc", "/app/btc"]
    restart: "no"
  commerce-service:
    build:
      context: .
      dockerfile: apps/commerce-service/Dockerfile
    # The shared block, as identity and sales: without it the staff tokens
    # here are the built-in defaults and the admin and seller routes refuse
    # the tokens set in .env.
    environment: *environment
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
  identity-service:
    build:
      context: .
      dockerfile: apps/identity-service/Dockerfile
    environment: *environment
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
  sales-service:
    build:
      context: .
      dockerfile: apps/sales-service/Dockerfile
    environment: *environment
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8300/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
  # Speech recognition for calls (apps/asr-service). On this machine's CPU by default;
  # to use one hosted elsewhere (a rented GPU, Dockerfile.gpu), set ASR_URL (and
  # ASR_API_KEY) to it and ASR_LOCAL=0 so this container does not start.
  asr-service:
    build:
      context: .
      dockerfile: apps/asr-service/Dockerfile
    environment:
      ASR_DEVICE: cpu
      ASR_PRELOAD: ${ASR_PRELOAD:-zipformer-30m}
      ASR_API_KEY: ${ASR_API_KEY:-}
      ASR_THREADS: ${ASR_THREADS:-4}
    volumes:
      # The same volume as the agent: the weights already downloaded are reused.
      - voice-models:/models
    deploy:
      replicas: ${ASR_LOCAL:-1}
  ai-agent-service:
    build:
      context: .
      dockerfile: apps/ai-agent-service/Dockerfile
      args:
        # 1 installs speech recognition and synthesis: needed by the browser call and the phone hotline.
        WITH_VOICE: ${AGENT_WITH_VOICE:-0}
        # Which voice speaks the calls; a local one (vieneu:) is installed into the image.
        VOICE_TTS: ${VOICE_TTS:-}
    environment:
      <<: *environment
      # Models and routing are in apps/ai-agent-service/config/models.yaml;
      # a provider is offered only when its key is set.
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-${GEMINI_API_KEY:-}}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Zalo OA (apps/ai-agent-service/src/ai_agent_service/runtime/zalo.py).
      ZALO_APP_ID: ${ZALO_APP_ID:-}
      ZALO_OA_ID: ${ZALO_OA_ID:-}
      ZALO_OA_SECRET_KEY: ${ZALO_OA_SECRET_KEY:-}
      ZALO_APP_SECRET: ${ZALO_APP_SECRET:-}
      ZALO_ACCESS_TOKEN: ${ZALO_ACCESS_TOKEN:-}
      ZALO_REFRESH_TOKEN: ${ZALO_REFRESH_TOKEN:-}
      # 1 only for scripts/dev/zalo_simulator.py without keys: accepts unsigned webhooks.
      ZALO_WEBHOOK_INSECURE: ${ZALO_WEBHOOK_INSECURE:-0}
      # Local mock platform only (scripts/dev/zalo_mock.py), e.g. http://host.docker.internal:8090.
      # Empty: Zalo's own openapi.zalo.me / oauth.zaloapp.com. Never set in production.
      ZALO_OPENAPI_URL: ${ZALO_OPENAPI_URL:-}
      ZALO_OAUTH_URL: ${ZALO_OAUTH_URL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      AGENT_DB_SCHEMA: ${AGENT_DB_SCHEMA:-agent}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      # Kept on the volume, so the embedding model is downloaded once, not on every container start.
      EMBEDDING_MODELS_DIR: /app/models/embedding
      # Text to speech for calls: openai:<voice> (cloud: coral, nova, sage, shimmer…; needs
      # OPENAI_API_KEY) or vieneu: (local CPU, ~1.4 GB of weights on first use). Empty:
      # voice.tts in apps/ai-agent-service/config/models.yaml. The Admin page can still switch.
      VOICE_TTS: ${VOICE_TTS:-}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
      # VOICE_TTS=elevenlabs: speaks with the agent voices of scripts/create_data/config/voices.yaml,
      # by the caller's region (CRM); unknown callers hear VOICE_DEFAULT_REGION, VOICE_GENDER.
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_TTS_MODEL: ${ELEVENLABS_TTS_MODEL:-eleven_flash_v2_5}
      VOICE_GENDER: ${VOICE_GENDER:-female}
      VOICE_DEFAULT_REGION: ${VOICE_DEFAULT_REGION:-bac}
      # Where calls are recognised: the asr-service container, or a GPU host elsewhere.
      ASR_URL: ${ASR_URL:-http://asr-service:8500}
      ASR_API_KEY: ${ASR_API_KEY:-}
      # Phone hotline (profile "hotline"): the bridge proves itself with this key to pass the caller's number.
      HOTLINE_BRIDGE_KEY: ${HOTLINE_BRIDGE_KEY:-local-hotline-bridge-change-me}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      SIP_TRUNK_ID: ${SIP_TRUNK_ID:-}
    volumes:
      - voice-models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8400/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
      # Startup loads the MCP servers and the embedding model (downloaded on the first start): minutes, not seconds.
      start_period: 300s
  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    environment:
      COMMERCE_SERVICE_URL: http://commerce-service:8100
      IDENTITY_SERVICE_URL: http://identity-service:8200
      SALES_SERVICE_URL: http://sales-service:8300
      AI_AGENT_SERVICE_URL: http://ai-agent-service:8400
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      commerce-service:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      sales-service:
        condition: service_healthy
      ai-agent-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
  commerce-events:
    <<: *runtime
    command: ["python", "-m", "src.messaging.worker", "--service", "commerce"]
    restart: unless-stopped
  identity-events:
    <<: *runtime
    command: ["python", "-m", "src.messaging.worker", "--service", "identity"]
    restart: unless-stopped
  sales-events:
    <<: *runtime
    command: ["python", "-m", "src.messaging.worker", "--service", "sales"]
    restart: unless-stopped
  ai-agent-events:
    <<: *runtime
    command: ["python", "-m", "src.messaging.worker", "--service", "ai-agent"]
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_HOTLINE: ${HOTLINE_NUMBER:-1900 6868}
        NEXT_PUBLIC_ZALO_OA_ID: ${ZALO_OA_ID:-}
    environment:
      BACKEND_URL: http://api-gateway:8000
    depends_on:
      api-gateway:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
  kafka:
    profiles: ["async"]
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  qdrant:
    profiles: ["retrieval"]
    image: qdrant/qdrant:v1.15.4
    volumes: ["qdrant-data:/qdrant/storage"]
  livekit:
    profiles: ["hotline"]
    image: livekit/livekit-server:v1.13.7
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-local-livekit-secret-change-me-32chars}"
    volumes: ["./infra/livekit/livekit.yaml:/etc/livekit.yaml:ro"]
    ports:
      - "7881:7881"
      - "40000-40100:40000-40100/udp"
    depends_on:
      redis:
        condition: service_healthy
  livekit-sip:
    profiles: ["hotline"]
    image: livekit/sip:v1.17.0
    environment:
      SIP_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:-devkey}
        api_secret: ${LIVEKIT_API_SECRET:-local-livekit-secret-change-me-32chars}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        sip_port: 5060
        rtp_port: 40200-40300
        use_external_ip: ${SIP_USE_EXTERNAL_IP:-false}
        logging:
          level: info
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "40200-40300:40200-40300/udp"
    depends_on:
      - livekit
  hotline-bridge:
    profiles: ["hotline"]
    build:
      context: .
      dockerfile: apps/hotline-bridge/Dockerfile
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-local-livekit-secret-change-me-32chars}
      AGENT_URL: http://ai-agent-service:8400
      SALES_URL: http://sales-service:8300
      HOTLINE_BRIDGE_KEY: ${HOTLINE_BRIDGE_KEY:-local-hotline-bridge-change-me}
      ROOM_PREFIX: hotline-
    depends_on:
      livekit:
        condition: service_started
      ai-agent-service:
        condition: service_healthy
      sales-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  qdrant-data:
  voice-models:
