apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-service
spec:
  replicas: 2
  selector:
    matchLabels: {app: telesales-ai-agent}
  template:
    metadata:
      labels: {app: telesales-ai-agent}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000}
      containers:
        - name: ai-agent-service
          image: telesales-ai-agent:dev
          ports: [{containerPort: 8400}]
          envFrom:
            - configMapRef: {name: telesales-config}
            - secretRef: {name: telesales-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          # The API process plus its five MCP server subprocesses; voice models add ~1.5Gi.
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: '2', memory: 3Gi}
          readinessProbe:
            httpGet: {path: /health/ready, port: 8400}
          livenessProbe:
            httpGet: {path: /health, port: 8400}
            initialDelaySeconds: 20
          # The root filesystem is read-only: voice weights (downloaded once at
          # start) and call recordings need writable mounts. Use a PVC for
          # voice-models in production so pods do not re-download on restart.
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: voice-models, mountPath: /app/models}
            - {name: runs, mountPath: /app/agent/runs}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: voice-models, emptyDir: {}}
        - {name: runs, emptyDir: {}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerce-events
spec:
  replicas: 1
  selector:
    matchLabels: {app: telesales-commerce-events}
  template:
    metadata:
      labels: {app: telesales-commerce-events}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000}
      containers:
        - name: commerce-events
          image: telesales-backend-common:dev
          command: [python, -m, src.messaging.worker, --service, commerce]
          envFrom:
            - configMapRef: {name: telesales-config}
            - secretRef: {name: telesales-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 512Mi}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
