apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerce-service
spec:
  replicas: 2
  selector:
    matchLabels: {app: telesales-commerce}
  template:
    metadata:
      labels: {app: telesales-commerce}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000}
      containers:
        - name: commerce-service
          image: telesales-commerce:dev
          ports: [{containerPort: 8100}]
          envFrom:
            - configMapRef: {name: telesales-config}
            - secretRef: {name: telesales-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: '1', memory: 512Mi}
          readinessProbe:
            httpGet: {path: /health/ready, port: 8100}
          livenessProbe:
            httpGet: {path: /health, port: 8100}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels: {app: telesales-gateway}
  template:
    metadata:
      labels: {app: telesales-gateway}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000}
      containers:
        - name: api-gateway
          image: telesales-gateway:dev
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: telesales-config}
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef: {name: telesales-secrets, key: REDIS_URL}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 384Mi}
          readinessProbe:
            httpGet: {path: /health/ready, port: 8000}
          livenessProbe:
            httpGet: {path: /health, port: 8000}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
