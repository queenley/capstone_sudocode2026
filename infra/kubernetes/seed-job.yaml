# Demo data on a cluster, as the `seed` service does locally (docker-compose.yml): the BTC catalogue, 70 CRM customers
# and their earlier orders, product photos. Run once after the migration Job;
# safe to run again, each row is skipped when it is already there. The data ships in the backend-common image
# (data/seed, apps/ai-agent-service/data/btc). Same image swap as migrate-job.yaml, and one more: kustomize names
# the config map telesales-config-<hash>, so replace telesales-config with the name the app's pods use.
apiVersion: batch/v1
kind: Job
metadata:
  name: telesales-seed
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 1000}
      containers:
        - name: seed
          image: telesales-backend-common:dev
          command: [python, -m, scripts.seed.catalog, --dataset, /app/data, --btc, /app/btc]
          envFrom:
            - configMapRef: {name: telesales-config}
            - secretRef: {name: telesales-secrets}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 1Gi}
