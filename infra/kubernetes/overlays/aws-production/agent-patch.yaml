# ai-agent-service on EKS: its service account (Pod Identity: send to the queue), on-demand nodes only (a Spot node
# taken back cuts a voice call short), the shared data on EFS, and room to finish the turns in hand on SIGTERM.
# The EFS volume starts empty: the init container copies what the image ships and EFS lacks, never over it, so an
# approved skills version or knowledge entry written at run time is kept.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-service
spec:
  template:
    spec:
      serviceAccountName: ai-agent-service
      terminationGracePeriodSeconds: 120
      nodeSelector:
        karpenter.sh/nodepool: on-demand
      initContainers:
        - name: seed-agent-data
          image: telesales-ai-agent:dev
          command: [sh, -c, 'for d in skills improvement kb; do mkdir -p /efs/$d && cp -rn /app/agent/data/$d/. /efs/$d/; done']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: agent-data, mountPath: /efs}
      containers:
        - name: ai-agent-service
          resources:
            # MCP servers run in their own Deployment here (mcp.yaml): the API process alone, plus voice.
            requests: {cpu: 250m, memory: 768Mi}
            limits: {cpu: '2', memory: 2560Mi}
          volumeMounts:
            - {name: agent-data, mountPath: /app/agent/data/skills, subPath: skills}
            - {name: agent-data, mountPath: /app/agent/data/improvement, subPath: improvement}
            - {name: agent-data, mountPath: /app/agent/data/kb, subPath: kb}
      volumes:
        - name: agent-data
          persistentVolumeClaim: {claimName: agent-data}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-worker
spec:
  template:
    spec:
      nodeSelector:
        karpenter.sh/nodepool: general
      containers:
        - name: ai-agent-worker
          volumeMounts:
            - {name: agent-data, mountPath: /app/agent/data/skills, subPath: skills}
            - {name: agent-data, mountPath: /app/agent/data/improvement, subPath: improvement}
            - {name: agent-data, mountPath: /app/agent/data/kb, subPath: kb}
      volumes:
        - name: agent-data
          persistentVolumeClaim: {claimName: agent-data}
