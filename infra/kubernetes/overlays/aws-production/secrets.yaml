# telesales-secrets from AWS Secrets Manager (External Secrets, role from infra/terraform/aws-eks/identity.tf):
# the app's keys and tokens from the secret Terraform made empty (set its values once, by hand), and DATABASE_URL
# built from the app role's secret (telesales-production/database, scripts/deployment/create-aurora-express.ps1).
# Nothing secret is in git or in Terraform state.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: __REGION__
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: telesales-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: {name: aws-secrets-manager, kind: SecretStore}
  target:
    name: telesales-secrets
    template:
      mergePolicy: Merge
      data:
        DATABASE_URL: "postgresql+psycopg://{{ .db_username }}:{{ .db_password | urlquery }}@__DATABASE_ENDPOINT__:5432/app_db?sslmode=require"
        # The gateway reads REDIS_URL from this secret (base/workloads.yaml, secretKeyRef), not from the configmap.
        REDIS_URL: "rediss://__VALKEY_ENDPOINT__:__VALKEY_PORT__/0"
  dataFrom:
    - extract: {key: __APP_SECRET_NAME__}
  data:
    - secretKey: db_username
      remoteRef: {key: __DATABASE_SECRET_ARN__, property: username}
    - secretKey: db_password
      remoteRef: {key: __DATABASE_SECRET_ARN__, property: password}
