# The app's nodes (eks-architecture.md 2.2). Two pools: on-demand for ai-agent-service (agent-patch.yaml selects it;
# it never consolidates a node with a call on it), general for everything else. Both go down to zero nodes when
# nothing asks for them, and are found by the karpenter.sh/discovery tag Terraform puts on the private subnets and
# the node security group (infra/terraform/aws-eks). Cluster-scoped: no namespace (kustomization.yaml).
#
# Instance types: the account is on the AWS Free plan, which launches only Free Tier types and no Spot, so both pools
# take on-demand m7i-flex.large / c7i-flex.large (2 vCPU each). On a paid plan, widen them: the on-demand pool to
# instance-category [c, m, t] and size [large, xlarge]; the general pool to capacity-type [spot, on-demand],
# category [c, m, r, t], size [medium, large, xlarge] (Spot is about 60-70% cheaper).
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: telesales
spec:
  role: __KARPENTER_NODE_ROLE__
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags: {karpenter.sh/discovery: __CLUSTER__}
  securityGroupSelectorTerms:
    - tags: {karpenter.sh/discovery: __CLUSTER__}
  metadataOptions:
    httpTokens: required
    httpPutResponseHopLimit: 1 # pods use Pod Identity, never the node's role
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs: {volumeSize: 40Gi, volumeType: gp3, encrypted: true}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: on-demand
spec:
  template:
    spec:
      nodeClassRef: {group: karpenter.k8s.aws, kind: EC2NodeClass, name: telesales}
      requirements:
        - {key: karpenter.sh/capacity-type, operator: In, values: [on-demand]}
        - {key: kubernetes.io/arch, operator: In, values: [amd64]}
        - {key: node.kubernetes.io/instance-type, operator: In, values: [m7i-flex.large, c7i-flex.large]}
  limits: {cpu: "32"}
  disruption:
    consolidationPolicy: WhenEmpty # never move a pod with a call on it to save money
    consolidateAfter: 10m
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general
spec:
  template:
    spec:
      nodeClassRef: {group: karpenter.k8s.aws, kind: EC2NodeClass, name: telesales}
      requirements:
        - {key: karpenter.sh/capacity-type, operator: In, values: [on-demand]}
        - {key: kubernetes.io/arch, operator: In, values: [amd64]}
        - {key: node.kubernetes.io/instance-type, operator: In, values: [m7i-flex.large, c7i-flex.large]}
  limits: {cpu: "48"}
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 2m
