apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: telesales
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://example.invalid/replace-with-your-repository.git
    targetRevision: main
    path: infra/kubernetes/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: telesales-production
  syncPolicy:
    syncOptions: [CreateNamespace=true]
