models:
  scenario:
    provider: openai
    model: gpt-4o-mini
  dialogue:
    provider: openai
    model: gpt-4o-mini
  customer:
    provider: openai
    model: gpt-4o-mini
  judge:
    provider: openai
    model: gpt-4o-mini
  simulator:
    provider: openai
    model: gpt-4o-mini
# Sampling parameters shared by every provider.
sampling:
  temperature: 0.7          # scenario / dialogue / CRM writers
  judge_temperature: 0.1    # LLM judge
  max_output_tokens: 8192
# Provider rate limits (requests per minute / per UTC day) and retries.
openai:
  rpm_limit: 10
  rpd_limit: 1000
  retries: 5
  retry_backoff_seconds: 2
gemini:
  rpm_limit: 10
  rpd_limit: 100
  retries: 5
  retry_backoff_seconds: 2
budget:
  max_elevenlabs_chars_per_run: 100000
scenario_audio:
  model_id: eleven_v4
  language_code: null
  voice_settings:
    stability: 0.35
    similarity_boost: 0.8
    style: 0.35
    speed: 1.0
  noise_fraction: 0.5
  noise_snr_db: 6
generation:
  # ~2.1 calls per scenario: 120 scenarios ~= 250 reference transcripts (one per call).
  scenario_target: 120
  transcript_target: 250
  audio_conversation_target: 100
  audio_hours_target: 3
  noisy_audio_fraction: 0.20
  seed: 20261007
