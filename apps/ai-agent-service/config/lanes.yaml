# Which tools the advisor may call in each lane. docs/design.md section 4.3.
#
# A lane is one configuration of the AdvisorAgent: its instruction lives with
# the advisor's prompts, its tools here. `route` picks the lane by rules on a
# state the code knows (failures, recognition, identity, a brief), never on a
# guess at what the customer is talking about: CONTINUITY and NEW carry every
# business tool and the advisor picks what the turn needs. A lane with no
# tools is a real answer: CLARIFY and CONFIRM_IDENTITY bind nothing, so "the
# agent called no tool" is mechanically true. HANDOFF has no entry: the
# harness itself transfers the call there, without a model
# (pipeline/hot/nodes.py, _transfer).
#
# The knowledge base is not a tool of any lane: load_context retrieves the
# turn's passages before the advisor runs (section 4.2), which saves a model
# round on every policy question and lets route read the retrieval score.
#
# Names are the wire names, the organisers' names with the dot as an
# underscore (inventory.check -> inventory_check); src/mcp/client.py turns
# them back for the trace.
lanes:
  CLARIFY: []
  CONFIRM_IDENTITY: []
  CONTINUITY: &business
    - account_cart
    - account_orders
    - account_profile
    - catalog_search
    - inventory_check
    - pricing_get_quote
    - delivery_estimate
    - order_create
    # An order the customer has (order_status, or crm_get_customer when no
    # code was given) and the change they ask on it (order_update): a change
    # is never a new order (rule 20 of config/prompts/agent/advisor/rules.md).
    - order_status
    - crm_get_customer
    - order_update
    - schedule_callback
    - handoff_transfer
    - memory_request_deletion
  NEW: *business
