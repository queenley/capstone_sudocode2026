# Which tools the advisor may call in each lane. docs/design.md section 4.3.
#
# A lane is one configuration of the AdvisorAgent: its instruction lives with
# the advisor's prompts, its tools here. `route` picks the lane by rules; the
# advisor is offered exactly these tools and no others. A lane with no tools
# is a real answer: CLARIFY and CONFIRM_IDENTITY bind nothing, so "the agent
# called no tool" is mechanically true.
#
# The knowledge base is not a tool of any lane: load_context retrieves the
# turn's passages before the advisor runs (section 4.2), which saves a model
# round on every policy question and lets route read the retrieval score.
#
# Names are the wire names, the organisers' names with the dot as an
# underscore (inventory.check -> inventory_check); src/mcp/client.py turns
# them back for the trace.
lanes:
  HANDOFF:
    - handoff_transfer
  CLARIFY: []
  CONFIRM_IDENTITY: []
  ORDER_SERVICE:
    - account_orders
    - account_cart
    - account_profile
    - order_status
    - order_update
    - delivery_estimate
    - crm_get_customer
    - handoff_transfer
    - memory_request_deletion
  OUT_OF_SCOPE:
    - handoff_transfer
  CONTINUITY: &sales
    - account_cart
    - account_orders
    - account_profile
    - catalog_search
    - inventory_check
    - pricing_get_quote
    - delivery_estimate
    - order_create
    # The order this call just created is corrected in the same lane: the
    # address or payment the customer adds after it (an order a second time
    # is refused before it runs, components/guardrails/actions.py).
    - order_update
    - schedule_callback
    - handoff_transfer
    - memory_request_deletion
  NEW: *sales
