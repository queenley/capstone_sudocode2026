# Which models each provider offers us, and what each provider is believed to
# allow. No secrets here — this file is committed. Keys live in .env, read from
# the environment, never interpolated into this file.
#
# The lists are deliberately short: the Admin page offers every model listed
# under a provider whose key is set, and a model nobody has measured is not a
# choice anyone should be offered.
#
# Dropped after the provider comparison of 2026-09-17, with the reason:
#   gemini-3.8-flash    daily quota exhausted after one call
#   gemini-2.5-flash    404, retired for new keys; the API names 3.6 instead
#   moonshotai/kimi-k3  every call timed out at 60s
#   z-ai/glm-5.3-flash  30s to first token, 10 tok/s
#
# Added on 2026-09-23 so the advisor's model can be switched at runtime and
# timed on the voice path; the Admin endpoint only accepts models listed here.
# None of them has passed the scored probe or produced an AdvisorDraft yet:
#   qwen/qwen3.8-27b       0.42s ttft in the unscored run of 2026-09-17
#   openai/gpt-oss-120b    2.24s ttft in the same run, for quality rather than speed
#   gemini-3.1-flash-lite  newer lite model on the same key, unmeasured
# gemini-2.5-flash-lite was added the same day and removed an hour later: the
# models endpoint lists it, but generating returns 404 "no longer available to
# new users". A listed model is not a usable one.
#
# The rate_limits blocks feed the rate limiter, one limiter per model, since
# the providers count per model. These are cautious guesses, not
# published figures: Google's rate-limit page now tells you to read your own
# quota in AI Studio rather than listing numbers, and NVIDIA states limits vary
# per model and are unpublished. Replace them with what you measure.

# Every number a model call is made with lives in this file, at one of three
# levels, each narrower than the last:
#
#   defaults      the system-wide value, used unless something below says
#                 otherwise. Shared settings belong here and nowhere else.
#   providers.*   what a provider forces on anyone routed to it. Only the
#                 fields it genuinely constrains; a preference is not a
#                 constraint.
#   agents.*      what one agent needs. This wins, except against a provider
#                 ceiling, which cannot be exceeded by wishing.
#
# A field left unset at all three levels is an error at startup, not a silent
# fall back to whatever the provider defaults to. `null` is different from
# unset and means "make the call without this parameter at all".
defaults:
  # docs/design.md section 9.6 and Appendix D: every call is temperature 0, or a
  # run cannot be reproduced and the evaluation cache never hits. This is the
  # one number that makes `eval replay` mean anything, so it is a default
  # rather than something each agent remembers to set.
  temperature: 0.0
  # Only reasoning models take it: null sends the call without it.
  reasoning_effort: null
  use_responses_api: null
  # OpenAI only: the processing tier. Null sends none.
  service_tier: null
  # OpenAI Responses API only (config_manager.Generation): null sends none.
  store: null
  include: null
  output_version: null
  # Enough for a short structured reply. An agent that reasons, or that answers
  # at length, raises it in its own block below.
  max_tokens: 1024
  # Seconds before a single call is abandoned. Without one, a model that stops
  # producing tokens mid-stream blocks the whole run indefinitely.
  timeout: 60.0
  # The SDKs retry internally, underneath LangChain, where neither the rate
  # limiter nor its callbacks can see it. One attempt per call keeps every
  # request visible to the limiter, which is the only thing that can space them
  # out.
  max_retries: 0

rate_limiter:
  # Headroom left under every published limit. Our count of a minute and the
  # provider's never agree exactly, and that is true of all of them, so this is
  # one setting for the process rather than one per provider.
  buffer_percentage: 0.1

# Agent -> model. An agent names a provider and a model here rather than
# hard-coding one, so swapping the model an agent uses is a line of config.
# The values come from the provider comparison of 2026-09-17.
agents:
  # The advisor is on the hot path, where a customer is waiting, so it is
  # chosen on time to first token rather than throughput, which is what the
  # provider comparison of 2026-09-17 recommended.
  advisor:
    # OpenAI since 2026-10-17: the Google AI Studio key's prepaid credits are
    # depleted (402 RESOURCE_EXHAUSTED). gemini-3.5-flash-lite stays listed
    # below and can be chosen again in the Agent Console.
    provider: openai
    # 2026-11-07: the best of the models tried for its price on four scenarios with many tools (TSR 2/4, one
    # over-escalation, against gpt-6-luna's 2/4 and three). The first token decides the call's silence, so no
    # reasoning: reasoning models take no temperature, and gpt-6-luna calls tools on Chat Completions only at none.
    model: gpt-5.6-luna
    generation:
      temperature: null
      reasoning_effort: none
      # OpenAI's processing tier: fast costs twice standard and is off until its cache reading is explained.
      service_tier: null
      # Tools at effort none work here; the client would otherwise move gpt-6 to the Responses API on its own.
      use_responses_api: false
      # gemini-3.5-flash-lite produces reasoning output, and thinking tokens
      # count against this budget before a single character of the reply does.
      # The reply itself is short, but it is a validated object: truncating it
      # is a parse failure and a wasted regeneration, not a shorter answer.
      max_tokens: 2048

  # docs/design.md section 9.4 and Appendix C: the evaluation's extractor of
  # questions, claims and fact use (ai_agent_service/components/evaluation/scorers.py). Not
  # an agent of the product; named here so
  # its model is one line of config like theirs, on the advisor's OpenAI key.
  extractor:
    provider: openai
    model: gpt-4.1-mini
    generation:
      # Per-item quotes and spans exceed 1024 tokens on long turns (Oct 17 run).
      max_tokens: 4096

  # docs/design.md section 5.4: the MemoryAgent reads the customer's words
  # with one structured-output call after the call; its rules stand in when
  # this model cannot answer. Off the hot path, so chosen for reading
  # Vietnamese rather than for speed.
  memory:
    provider: openai
    model: gpt-4.1-mini
    generation:
      max_tokens: 2048

  # Section 4.4: folds the turns of a long call into working_summary. On the
  # hot path, but only once a call passes sixteen messages.
  compactor:
    provider: openai
    model: gpt-4.1-mini
    generation:
      max_tokens: 1024

  # Section 10.3: the QaAgent scores a learning run's calls on the BTC rubric
  # and says what kind of failure each is. Not the evaluation's judge: that one
  # is pinned on the evaluation side and no improvement round ever changes it.
  # 2026-11-09: the advisor's own model, with reasoning: whether a skill
  # already covers a failure decides what Reflection may learn, so the
  # diagnosis is not left to a weaker model than the one it judges.
  qa:
    provider: openai
    model: gpt-5.6-luna
    generation:
      temperature: null
      reasoning_effort: medium
      use_responses_api: false
      # Reasoning tokens count against this budget before the answer does.
      max_tokens: 8192

  # Section 7.3: the questions each policy section answers, written once into
  # data/kb/questions.jsonl and indexed with it (components/knowledge/expand.py).
  # Offline and once per section's words; never on the hot path.
  knowledge:
    provider: openai
    model: gpt-5.6-luna
    generation:
      temperature: null
      reasoning_effort: low
      use_responses_api: false
      max_tokens: 4096

  # Section 10.3: the advisor's reflection on its own calls, after they end:
  # lesson cards, and the one sentence of a skill several cards share. A larger
  # model than the advisor's (2026-11-10): off the hot path, a few calls a
  # round, and the lessons are only as good as the model drawing them (ACE).
  # gpt-6.1-sol has no `none` effort and needs the Responses API
  # (openai.model_generation below).
  reflection:
    provider: openai
    model: gpt-6.1-sol
    generation:
      temperature: null
      reasoning_effort: low
      use_responses_api: true
      max_tokens: 8192

  # Section 10.4: decides a Reflection change against what the people who
  # wrote the learning set expect it to learn (agents/approval.py). One call
  # per change, on a model as strong as the one that wrote it.
  approval:
    provider: openai
    model: gpt-6.1-sol
    generation:
      temperature: null
      reasoning_effort: low
      use_responses_api: true
      max_tokens: 4096

  # The exploration's customer (agents/simulator.py): its persona voice and
  # its observer of the agent's questions and prices. Offline, on the
  # learning set only, and never the evaluation's simulator.
  simulator:
    provider: openai
    model: gpt-4.1-mini
    generation:
      temperature: 0.3
      max_tokens: 2048

# AGENT_PROFILE=<name> in .env sends every agent listed under the profile to
# its model, each keeping its own generation block; an agent under
# `overrides` goes to the model named there instead. `local` is the free key a
# laptop runs on. The evaluation's extractor is not listed: a measuring
# instrument does not change with the machine it runs on (add it locally to
# run without a paid key, and the labels are then not comparable).
profiles:
  local:
    provider: google_genai
    model: gemini-3.5-flash-lite
    # qa, reflection and approval are not moved (2026-11-09): the improvement loop's
    # diagnosis and lessons stay on their own strong model on every machine,
    # or a round run on a laptop would learn from a weaker judge.
    agents: [advisor, memory, compactor]
    overrides:
      # The free tier stops a model at 500 requests a day (2026-10-25), and
      # the exploration's customer makes two or three calls per agent turn,
      # so it spends another model's quota. Chosen 2026-10-26 on one persona
      # and one observer call each: gemini-3.1-flash-lite answered both
      # schemas in about 8 s; NVIDIA deepseek-v4.1-flash and gpt-oss-20b timed
      # out at 180 s, nemotron-3-super-120b-a12b is not served to this key.
      # Keep the same split between R0 and R1, or the rounds do not compare.
      simulator:
        provider: google_genai
        model: gemini-3.1-flash-lite

providers:
  google_genai:
    label: Google AI Studio
    models_url: https://generativelanguage.googleapis.com/v1beta/models
    models:
      - gemini-3.5-flash-lite
      - gemini-3.5-flash
      - gemini-3.6-flash
      - gemini-3.1-flash-lite
    rate_limits:
      # Measured 2026-10-31 on the free tier, per model: the 17th request of a
      # minute to gemini-3.5-flash-lite came back 429 with
      # GenerateRequestsPerMinutePerProjectPerModel-FreeTier = 15. The guess
      # of 10 before it made local runs spend most of their time queueing
      # behind themselves (the limiter's waited_s).
      requests_per_minute: 15
      input_tokens_per_minute: 250000
      output_tokens_per_minute: 50000

  groq:
    label: Groq
    models_url: https://api.groq.com/openai/v1/models
    models:
      - openai/gpt-oss-20b
      - qwen/qwen3.8-27b
      - openai/gpt-oss-120b
    rate_limits:
      requests_per_minute: 30
      input_tokens_per_minute: 6000
      # Groq enforces this per model and refuses a request whose *expected*
      # output exceeds it, which is what max_output_tokens below is for.
      output_tokens_per_minute: 1000
    # A request Groq will not accept, whatever the agent asked for. Kept under
    # the per-minute allowance above so that one reply cannot spend the whole
    # minute's output budget and stall every conversation behind it.
    max_output_tokens: 800

  nvidia:
    label: NVIDIA NIM
    models_url: https://integrate.api.nvidia.com/v1/models
    models:
      - nvidia/nemotron-3-super-120b-a12b
    generation:
      # ChatNVIDIA forwards keyword arguments it does not recognise into the
      # request body, and the server rejects the whole call with "Unsupported
      # parameter(s): max_retries". null means the parameter is not sent at
      # all, which is different from sending zero. Found by running the probe,
      # which failed all twelve NVIDIA calls.
      max_retries: null
    rate_limits:
      requests_per_minute: 40
      input_tokens_per_minute: 100000
      output_tokens_per_minute: 50000

  openai:
    label: OpenAI
    models_url: https://api.openai.com/v1/models
    # gpt-6.1-sol: reasoning.effort is low, medium (default), high, xhigh or max, never none; tool calling
    # requires the Responses API (developers.openai.com/api/docs/guides/latest-model, read 2026-11-10).
    model_generation:
      gpt-6.1-sol:
        reasoning_effort: low
        use_responses_api: true
    # gpt-4.1-mini is the default of the offline evaluation (run_eval.py);
    # it takes temperature 0, which the gpt-5 reasoning models refuse.
    models:
      - gpt-6.1-sol
      - gpt-6-luna
      - gpt-5.6-luna
      - gpt-4.1-mini
      - gpt-4o-mini
      - gpt-4.1-nano
    rate_limits:
      # This key's x-ratelimit-limit-* headers, read on 2026-11-07: 30,000 requests a minute on every model, tokens
      # 180M on gpt-5.6-luna and gpt-6-luna and 150M on gpt-4.1-mini; the lowest is kept. The earlier guess of
      # 60 requests and 200k tokens made turns wait here for up to 10 s, and that wait counts in TTFT.
      requests_per_minute: 30000
      input_tokens_per_minute: 150000000
      output_tokens_per_minute: 150000000
      # USD per million tokens, gpt-4.1-mini's list price (openai.com/api/pricing);
      # the evaluation's Langfuse spend is computed from these. One price per
      # provider: update it when the advisor moves to another OpenAI model.
      input_token_price_per_million: 0.40
      output_token_price_per_million: 1.60

# ── Evaluation models ────────────────────────────────────────────────────────
# An evaluation model reads a piece of state and answers typed questions with a
# probability. It writes no text. That is the shape of the soft guardrail of
# docs/design.md section 4.5 ("does this draft promise free shipping the tools
# did not give"), so the PolicyAgent asks one of these.
#
# Kept apart from `providers` and `agents` on purpose: these are not chat
# models, LangChain has no integration for them, and the Admin page offers
# every model under `providers` to the advisor, which must never include one
# of these.
evaluation_providers:
  # OpenAI's Decisions API, POST /v1/decisions, with OPENAI_API_KEY. gpt-6-luna is
  # the only model it takes. Output is not charged; cached input is a tenth of the rate.
  openai:
    label: OpenAI Decisions
    models:
      - gpt-6-luna
    rate_limits:
      # The guide publishes no limit for this endpoint, so these are the chat models' on this key,
      # and a 429 starts the limiter's cooldown. Replace them with this endpoint's headers once read.
      requests_per_minute: 30000
      input_tokens_per_minute: 150000000
      output_tokens_per_minute: 150000000
      input_token_price_per_million: 0.10

# Agent -> evaluation model. `timeout` is how long the caller waits before going on
# without an answer, when the check holds a reply; a review beside the stream waits longer.
evaluators:
  policy:
    provider: openai
    model: gpt-6-luna
    timeout: 1.5

# ── Voice ────────────────────────────────────────────────────────────────────
# docs/design.md section 4.11 and Appendix C: VAD, ASR and TTS run locally.
# These are the choices a call starts with; the Admin page may change them for
# this process, the way it changes the advisor's model. The weights are not
# in the repository: `python -m src.components.voice.fetch` downloads them into
# `models/voice/`, and the packages are in requirements-voice.txt.
voice:
  # Which recogniser turns the caller's speech into text. The lab of
  # 2026-09-22 found the 30M Zipformer the fastest on CPU at a usable WER.
  asr: zipformer-30m
  # How the end of the caller's turn is decided: "smart" asks Smart Turn v3.2
  # after 200 ms of silence and ends at 1.2 s regardless; "silence-<ms>" ends
  # after a fixed silence.
  endpointing: smart
  # Continuous speech, in ms, that pauses the agent: the caller may be cutting
  # in. Shorter sounds ("dạ", "vâng") are backchannel and ignored.
  barge_in_ms: 400
  # What turns that pause into an interruption, as LiveKit's agents do it
  # (min_interruption_words, false_interruption_timeout): the words recognised
  # must number at least this many and not all be backchannel ("ừ", "vâng");
  # otherwise the agent resumes where it paused. The same bar applies to
  # anything said while the agent is still working out its answer.
  min_interruption_words: 2
  # A pause that has heard no words by then resumes as well.
  false_interruption_ms: 2500
  # vieneu: local and streaming. edge:<voice> uses Microsoft's free endpoint,
  # which refuses a share of requests, so it is for listening, not timing.
  tts: "vieneu:"
  # Section 4.11: brand names the recogniser is told to expect (the
  # catalogue's brands are added on their own), and what it wrote -> what was
  # said. Only errors actually heard in the lab belong here.
  lexicon:
    hotwords: [AirPure, Xiaomi, Samsung, Karofi, Kangaroo, Sunhouse, RunLite]
    corrections:
      # Heard in the lab of 2026-09-22 and again on the first live call.
      like tờ: Lite
      liker: Lite
      layer tờ: Lite
      xiao mi: Xiaomi
      sam sung: Samsung
      e pua: AirPure
      ea pua: AirPure
      # Zipformer 30M on scripts/dev/question.wav, live calls of 2026-10-23/24.
      e-po: AirPure
      e po: AirPure
      epo: AirPure
      lõi lộc: lõi lọc
      sai z eo: size L
      # How spoken Vietnamese spells the catalogue's names; recognisers
      # write them down the same way.
      e pia: AirPure
      run lai: RunLite
      ka rô phi: Karofi
      pờ rô: Pro
      cê ô đê: COD
      # Zipformer 30M on the data/dev customer clips (2026-11-10), each heard at least twice and always for
      # the same product in the reference text; checked on the data/test clips.
      aibia: AirPure Y
      epi ni: AirPure Mini
      drapark: Joie Pact
      drap bắc: Joie Pact
      ra pack: Joie Pact
      joe park: Joie Pact
      combie: Combi
      slicker: sneaker
      classige: Classic
      mosk: Moaz
      trekking hydro: trekking HikePro
      treking hydro: trekking HikePro
      # v13, same rule: "2 Pro" said "hai pờ rô" (47 times, all RunLite 2 Pro); a spelling of RunLite that the
      # sound match extends to "jun like", "rum like", "ron like".
      hy pro: hai Pro
      hypro: hai Pro
      run like: RunLite
      tiệc trùng: tiệt trùng
