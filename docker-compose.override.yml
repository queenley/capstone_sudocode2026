# Local: this machine. `docker compose up` reads this file on its own, after
# docker-compose.yml (and only then: with -f, name the files you want).
#
# Everything listens on 127.0.0.1 only; secrets fall back to the development
# defaults of docker-compose.yml; ASR runs on this CPU (asr-service) and the
# voice is VOICE_TTS from .env (vieneu: on this CPU, or a cloud one).
services:
  postgres:
    ports: ["127.0.0.1:5432:5432"]
  redis:
    ports: ["127.0.0.1:6379:6379"]
  api-gateway:
    ports: ["127.0.0.1:8000:8000"]
  web:
    ports: ["127.0.0.1:3000:3000"]
  qdrant:
    ports: ["127.0.0.1:6333:6333"]
  livekit:
    ports:
      - "127.0.0.1:7880:7880"
