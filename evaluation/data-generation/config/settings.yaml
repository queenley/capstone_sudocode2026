models:
  scenario:
    provider: openai
    model: gpt-4o-mini
  dialogue:
    provider: openai
    # The hardest writer: a whole call that passes BTC's checks. gpt-4o-mini dropped the customer's lines.
    model: gpt-4.1
  customer:
    provider: openai
    model: gpt-4o-mini
  judge:
    provider: openai
    model: gpt-4o-mini
  simulator:
    provider: openai
    model: gpt-4o-mini
  asr_reference:
    # Customer turns in spoken form before TTS reads them (src/asr/reference.py): the ASR ground truth.
    provider: openai
    model: gpt-4.1-mini
# Sampling parameters shared by every provider.
sampling:
  temperature: 0.7          # scenario / dialogue / CRM writers
  judge_temperature: 0.1    # LLM judge
  max_output_tokens: 8192
# Provider rate limits (requests per minute / per UTC day) and retries.
openai:
  rpm_limit: 10
  rpd_limit: 1000
  retries: 5
  retry_backoff_seconds: 2
gemini:
  rpm_limit: 10
  rpd_limit: 100
  retries: 5
  retry_backoff_seconds: 2
budget:
  # 3 hours of customer speech is about 150.000 characters.
  max_elevenlabs_chars_per_run: 250000
scenario_audio:
  model_id: eleven_v4
  language_code: null
  voice_settings:
    stability: 0.35
    similarity_boost: 0.8
    style: 0.35
    speed: 1.0
  noise_fraction: 0.5
  noise_snr_db: 6
generation:
  # BTC personas (SCN-GEN) + the team's advanced ones (SCN-ADV, config/personas_advanced.yaml):
  # 150 + 76 scenarios ~= 460 calls, one reference transcript each.
  scenario_target: 150
  advanced_scenario_target: 76
  transcript_target: 460
  # M2 targets checked by summarize_dataset: customer audio and customers seen on 2+ channels.
  audio_hours_target: 3
  multi_channel_customers_target: 30
  noisy_audio_fraction: 0.20
  seed: 20261007
