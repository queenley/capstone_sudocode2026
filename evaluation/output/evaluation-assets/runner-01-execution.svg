<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" viewBox="0 0 1320 1320"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#62758a"/></marker></defs><rect width="100%" height="100%" fill="#f7fafc"/><style>text{font-family:Arial,sans-serif;fill:#18334e}.title{font-size:28px;font-weight:700}.sub{font-size:17px;fill:#526a80}.label{font-size:19px;font-weight:600}.body{font-size:17px}.edge{fill:none;stroke:#62758a;stroke-width:2;marker-end:url(#arrow)}</style><text x="40" y="45" class="title">1. Chuẩn bị và chạy Evaluation Runner</text><text x="40" y="78" class="sub">Fixed-turn là phép đo chính; ASR là suite độc lập, có thể liên kết bằng scenario_id.</text>
<rect x="40" y="110" width="370" height="115" rx="13" fill="#e5f2ff" stroke="#9ab1c5"/>
