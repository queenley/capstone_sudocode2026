<text x="660" y="165" text-anchor="middle" class="body">Model, prompt, tools, KB, seed</text>
<text x="660" y="190" text-anchor="middle" class="body">Catalog / policy đúng ngày gọi</text>
<rect x="910" y="110" width="370" height="115" rx="13" fill="#e5f2ff" stroke="#9ab1c5"/>
<text x="1095" y="140" text-anchor="middle" class="label">ASR eval set riêng</text>
<text x="1095" y="165" text-anchor="middle" class="body">Audio + transcript / entity chuẩn</text>
<text x="1095" y="190" text-anchor="middle" class="body">BTC khi phát + ≥20 file nhóm</text>
