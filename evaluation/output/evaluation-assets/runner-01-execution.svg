<text x="220" y="635" text-anchor="middle" class="body">Call 1 → chờ after-call / memory</text>
<text x="220" y="660" text-anchor="middle" class="body">Đổi ngày → Call 2 / Call 3…</text>
<text x="220" y="685" text-anchor="middle" class="body">Đọc memory đúng khách</text>
<rect x="480" y="580" width="360" height="140" rx="13" fill="#eef0ff" stroke="#9ab1c5"/>
<text x="660" y="610" text-anchor="middle" class="label">Baseline: Memory OFF</text>
<text x="660" y="635" text-anchor="middle" class="body">Cùng call / ngày / tools / KB</text>
<text x="660" y="660" text-anchor="middle" class="body">Chặn đọc memory hội thoại cũ</text>
<text x="660" y="685" text-anchor="middle" class="body">Working memory vẫn có</text>
