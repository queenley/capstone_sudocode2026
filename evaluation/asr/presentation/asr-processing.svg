<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1400 1000">
<title>Xử lý ASR và chấm điểm chi tiết</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#496078"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#172b45}.title{font-size:36px;font-weight:bold}.name{font-size:25px;font-weight:bold}.sub{font-size:22px}.line{fill:none;stroke:#496078;stroke-width:3;marker-end:url(#a)}.box{stroke:#c3d0de;stroke-width:2;rx:15}</style>
<rect width="1400" height="1000" fill="white"/>
<text x="60" y="60" class="title">WHISPER → TEXT → ENTITY → ĐÁNH GIÁ</text>
<rect x="450" y="105" width="500" height="110" class="box" fill="#e8f2ff"/><text x="700" y="148" text-anchor="middle" class="name">Audio WAV đã kiểm tra</text><text x="700" y="183" text-anchor="middle" class="sub">16 kHz · mono · PCM16</text>
<path d="M700 215 V250" class="line"/>
<rect x="450" y="260" width="500" height="110" class="box" fill="#efeafb"/><text x="700" y="303" text-anchor="middle" class="name">Whisper Medium / faster-whisper</text><text x="700" y="338" text-anchor="middle" class="sub">Nhận dạng tiếng Việt, lưu text + segments</text>
<path d="M700 370 V405" class="line"/>
<rect x="450" y="415" width="500" height="95" class="box" fill="#e8f2ff"/><text x="700" y="454" text-anchor="middle" class="name">Giữ nguyên transcript raw</text><text x="700" y="488" text-anchor="middle" class="sub">Ví dụ: “bốn triệu… không chín không…”</text>
<path d="M700 510 V548 H240 V590" class="line"/><path d="M700 510 V590" class="line"/><path d="M700 510 V548 H1160 V590" class="line"/>
<rect x="50" y="600" width="380" height="135" class="box" fill="#e8f2ff"/><text x="240" y="642" text-anchor="middle" class="name">Nhánh raw</text><text x="240" y="680" text-anchor="middle" class="sub">Text nhận dạng nguyên bản</text><text x="240" y="712" text-anchor="middle" class="sub">→ WER / CER raw</text>
<rect x="510" y="600" width="380" height="135" class="box" fill="#e8f2ff"/><text x="700" y="642" text-anchor="middle" class="name">Nhánh chuẩn hóa</text><text x="700" y="680" text-anchor="middle" class="sub">Cùng quy tắc cho GT và hyp</text><text x="700" y="712" text-anchor="middle" class="sub">→ WER / CER normalized</text>
<rect x="970" y="600" width="380" height="135" class="box" fill="#fff2da"/><text x="1160" y="642" text-anchor="middle" class="name">ITN + extractor</text><text x="1160" y="680" text-anchor="middle" class="sub">Tiền → số; SĐT → dãy chữ số</text><text x="1160" y="712" text-anchor="middle" class="sub">Không thêm / cắt số để khớp GT</text>
<path d="M240 735 V777 H700 V810" class="line"/><path d="M700 735 V810" class="line"/><path d="M1160 735 V777 H700" class="line"/>
<rect x="450" y="820" width="500" height="110" class="box" fill="#e3f5ec"/><text x="700" y="862" text-anchor="middle" class="name">Đối chiếu GT và tổng hợp report</text><text x="700" y="897" text-anchor="middle" class="sub">Chất lượng + coverage + thời gian + lỗi</text>
<rect x="35" y="825" width="325" height="100" class="box" fill="#e3f5ec"/><text x="197" y="865" text-anchor="middle" class="name">Ground truth</text><text x="197" y="900" text-anchor="middle" class="sub">Chỉ dùng để chấm</text><path d="M360 875 H440" class="line"/>
<text x="60" y="973" class="sub">Hypothesis thiếu / hỏng → INCOMPLETE. SĐT thiếu / thừa chữ số → ghi lỗi, không đoán đáp án.</text>
</svg>
