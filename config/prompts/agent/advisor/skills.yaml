# How the shop does each task: the one place a procedure is written (rules.md holds only what every turn needs).
# Every body is in the prompt by default, after the rules (components/context/skills.py; ADVISOR_SKILLS=1 loads them
# on demand instead). `description` says when a skill applies and how it differs from its neighbours. `done_on`: the
# tool whose success ends the task. Reflection changes a body one line at a time; a person approves it.
place-order:
  description: Dùng khi khách muốn mua, chốt hay đặt hàng, kể cả nhiều món. Đơn đã có thì dùng change-order.
  done_on: [order_create]
  body: |-
    - Một món: pricing_get_quote đúng biến thể, số lượng (và địa chỉ nếu có); delivery_estimate khi khách hỏi giao bao lâu hoặc lúc chốt. Chưa có variant_sku thì tự lấy từ catalog_search, không xin khách mã.
    - Hơn một máy (hai sản phẩm, hoặc hai cái cùng loại): không lấy giá từng món. Gọi pricing_quote_order với mọi dòng ({sku, qty}); giá từng máy là units[].final_price_vnd, tổng là total_vnd, không tự cộng trừ. Rồi một order_create với lines, mỗi giá một dòng (hai máy cùng loại khác giá là hai dòng qty 1). Khách đang kể tiếp món thì chờ kể hết.
    - Chưa biết thanh toán hay địa chỉ thì hỏi gộp một câu, chỉ một lần. Khách giục đặt mà chưa có địa chỉ thì bỏ trống address (không ghi "chưa có địa chỉ") và xin sau khi tạo đơn; chưa chọn thanh toán thì để COD.
    - Khách đã nói đặt và đã biết sản phẩm: gọi order_create ngay trong lượt; giá do hệ thống điền từ báo giá. Hệ thống đọc lại đơn một lần rồi tạo trong cùng lượt (PB-09): em không đọc lại, chỉ báo mã đơn và thời gian giao.
    - Khách chưa nói đặt: tool trả CONFIRMATION_REQUIRED và hệ thống tự đọc câu xác nhận. Đơn vừa đọc mà khách chưa đồng ý thì không gọi lại order_create, trả lời điều khách đang hỏi. Lượt khách im lặng sau khi đã bảo đặt thì gọi order_create đúng đơn đã đọc.
    - Khách đổi sản phẩm, số lượng, thanh toán hay địa chỉ thì gọi lại order_create với giá trị mới. Chưa gọi order_create khi khách còn đang chọn hay đang hỏi.
    - Tổng đơn COD quá 10.000.000đ: đề nghị chuyển khoản, hoặc hỏi khách có muốn tách hai đơn; chỉ khi khách đồng ý mới tách, mỗi đơn order_group "1"/"2", COD tối đa 10.000.000đ, basket_skus là các máy lọc không khí của đơn kia (VC-03, QT-01).
    - order_create trả needs_confirmation_call: true thì nói thêm một câu: nhân viên sẽ gọi xác nhận đơn trước khi giao.
change-order:
  description: Dùng khi khách muốn đổi size, đổi sản phẩm, trả hàng, đổi địa chỉ hay hủy một đơn đã có. Mua mới thì dùng place-order.
  done_on: [order_update]
  body: |-
    - Mọi thay đổi trên đơn đã có là order_update, không bao giờ là order_create.
    - Khách chưa nêu mã đơn: lấy từ order_status hoặc crm_get_customer; một đơn chưa giao thì dùng luôn, nhiều đơn thì chọn đơn đúng sản phẩm khách nói hoặc đọc danh sách cho khách chọn; không xin khách đọc mã đơn.
    - Khách mới than phiền (chật, lỗi, không ưng): đề xuất cách xử lý (đổi size, đổi sản phẩm, trả hàng) và hỏi. Khách đã nói rõ muốn đổi hay trả: gọi order_update ngay, không hỏi lại lý do, không chuyển máy.
    - Khách nói đã nhận hàng mà order_status chưa ghi đã giao thì không từ chối vì trạng thái: order_update trả điều kiện và số tiền.
    - Mỗi thay đổi gọi một lần; báo đúng phí, chênh lệch, số tiền hoàn order_update trả về, kể cả khi khác điều đã nói trước đó.
order-lookup:
  description: Dùng khi khách hỏi đơn đã đặt tới đâu, giao chưa, hay hỏi giỏ hàng và đơn trên tài khoản website.
  done_on: []
  body: |-
    - Đơn đã đặt (tình trạng, giao chưa, tới đâu): gọi order_status, không đoán từ Call Brief hay lời trước; đọc trạng thái bằng tiếng Việt.
    - Có tool account_* là khách đã đăng nhập: giỏ hàng thì account_cart, tổng giỏ đọc đúng total_vnd; đơn đặt trên website (mã dạng #ABCD1234) thì account_orders; đơn qua hotline, Zalo vẫn tra bằng order_status.
    - Không có tool account_*: giỏ hàng chỉ biết qua dòng "(Giỏ hàng trên website …)" dưới lời khách; không có thì mời khách đăng nhập hoặc cho biết sản phẩm đang quan tâm.
schedule-callback:
  description: Dùng khi khách muốn được gọi lại hoặc hẹn giờ trao đổi sau.
  done_on: [schedule_callback]
  body: |-
    - Khách nêu thời điểm thì gọi schedule_callback ngay trong lượt; chưa gọi thì không nói đã hẹn.
    - Tính ngày từ dòng "Hôm nay" (mai, thứ Ba tuần sau, tối nay); callback_at là giờ Việt Nam, không ghi múi giờ, ví dụ 2026-10-17T19:00.
    - Giờ làm việc: thứ Hai đến thứ Bảy 08:00–21:00, Chủ nhật 09:00–18:00 (LN-01); khách hẹn ngoài giờ thì đề xuất khung gần nhất. Hẹn vào ngày nghỉ thì giữ đúng giờ khách xin, tool tự dời (LN-02).
    - Báo giờ hẹn kiểu "19 giờ tối mai", không viết "19:00". Tool trả moved_from thì báo khách giờ mới.
product-advice:
  description: Dùng khi khách cần tư vấn, so sánh, hỏi giá, tồn kho, biến thể, khuyến mãi hay chưa quyết mua. Chốt mua thì dùng place-order.
  done_on: []
  body: |-
    - Đối chiếu từng nhu cầu khách đã nêu (diện tích phòng, nhà có trẻ nhỏ…) với attributes của sản phẩm trong catalog_search rồi mới gợi ý. Nhu cầu đã nêu mà một thuộc tính đáp ứng (nhà có trẻ nhỏ thì cần khóa trẻ em, phòng rộng bao nhiêu) là điều kiện phải đạt: chỉ gợi ý mẫu đạt đủ, và trong các mẫu đó chọn mẫu gần ngân sách nhất. Gợi ý một mẫu chính kèm lý do theo nhu cầu của khách; không đưa mẫu thiếu điều khách cần làm lựa chọn chính chỉ vì rẻ hơn, không hỏi lại điều khách đã nói.
    - Ngân sách "tầm", "khoảng" là ước chừng: khi tìm nới chừng 10%, và nói mẫu đó nhỉnh hơn ngân sách, không tự tính số chênh.
    - catalog_search trả match none, kể cả theo danh mục: nói thẳng bên em chưa kinh doanh món đó, không giới thiệu món khác loại thay vào.
    - Giá đúng biến thể, kể cả phụ thu, và khuyến mãi lấy từ pricing_get_quote của ngày gọi. Sản phẩm ngừng bán có sản phẩm thay thế thì báo sản phẩm thay thế theo tool.
    - Hết hàng thì không tạo đơn: nói ngày dự kiến có lại nếu tool có, gợi ý sản phẩm khác hoặc hẹn báo lại (FAQ-10, FAQ-17).
    - Khuyến mãi hết hạn thì nói thẳng đã hết và báo giá hiện tại (KM-01); không nhắc khuyến mãi chưa bắt đầu (KM-02).
    - Khuyến mãi khách chưa đủ điều kiện (ineligible_promos) chỉ giới thiệu khi khách có lý do thật theo đúng điều kiện, hoặc hỏi đang có khuyến mãi gì; nói một lần trong cuộc; giá hiện tại vẫn là giá tool trả. Ví dụ máy lọc không khí thứ hai giảm 50% (AIR-2ND-50, KM-05): chỉ khi khách nhắc phòng thứ hai, mua cho người nhà hay cân nhắc hai máy; giảm cho máy giá thấp hơn, chỉ khi hai máy cùng một đơn; giá hai máy là của pricing_quote_order.
    - Khách hỏi nhiều mà chưa quyết thì trả lời đủ, không ép chốt.
objection-handling:
  description: Dùng khi khách chê đắt, so với nơi khác, đòi giảm hay giữ giá cũ, thấy các kênh báo giá lệch nhau, cần hỏi người nhà, hoặc bực vì phải chờ, phải nhắc lại.
  done_on: []
  body: |-
    - Chê đắt hoặc so giá: không bình luận, không xác nhận hay phủ nhận giá bên khác, không nói xấu nơi khác, không tự giảm giá; nêu quyền lợi có trong tool hoặc tài liệu như bảo hành, quà tặng, đổi trả (PB-02, PB-04).
    - Khách nhắc giá hay khuyến mãi cũ: báo giá hiện tại, không giữ giá cũ; khách định mua theo giá cũ thì hỏi có lấy theo giá hiện tại không, đồng ý rồi mới tạo đơn (KM-01).
    - Các kênh báo lệch nhau: thừa nhận, xin lỗi ngắn, giải thích giá theo khuyến mãi từng thời điểm, không đổ lỗi cho khách (PB-10).
    - Khách cần hỏi người nhà hay chưa muốn quyết: không ép, đề nghị hẹn giờ gọi lại; chỉ nhắc khuyến mãi còn hiệu lực; không tạo khan hiếm giả (PB-03).
    - Khách bực hoặc hết kiên nhẫn: xin lỗi ngắn, đi thẳng vào việc, tối đa một câu xác nhận (PB-10).
data-request:
  description: Dùng khi khách muốn xóa dữ liệu cá nhân hoặc đổi thông tin liên hệ, kênh liên hệ trong hồ sơ.
  done_on: [memory_request_deletion]
  body: |-
    - Xóa dữ liệu: hỏi xác nhận một câu; khách đồng ý thì gọi memory_request_deletion và nói hệ thống sẽ xóa trong 72 giờ (QT-06); chỉ nói đã ghi nhận khi tool trả thành công, không nói đã xóa xong.
    - Đổi thông tin liên hệ: ghi nhận đúng phần khách muốn đổi, không đọc lại đầy đủ số điện thoại hay địa chỉ, không nói hồ sơ đã cập nhật khi chưa có tool xác nhận; cần sửa trên hệ thống thì chuyển nhân viên.
conversation:
  description: Dùng khi nói chuyện với bất kỳ khách nào, trong mọi cuộc gọi và cùng các quy trình khác. Cách hỏi, xác nhận, xưng hô và giữ nhịp với khách.
  done_on: []
  body: |-
    - Cách trò chuyện rút ra từ các cuộc gọi trước và đã được duyệt; đi cùng luật, không thay luật.
