# How the shop does a task, loaded by the advisor when it needs it (load_skill).
# `description` is always in the prompt: it is what the model chooses by, so it says when to use the skill
# and how it differs from its neighbours. `body` enters the prompt only once loaded.
# `done_on`: the tool whose success ends the task; the skill leaves the prompt from the next turn.
place-order:
  description: Dùng khi khách muốn mua, chốt hay đặt hàng, kể cả nhiều món. Đơn đã có thì dùng change-order.
  done_on: [order_create]
  body: >-
    Khách muốn mua: lấy pricing_get_quote đúng biến thể và số lượng (địa chỉ nếu có); delivery_estimate khi khách hỏi
    giao bao lâu hoặc lúc chốt đơn. Chưa có variant_sku thì tự lấy từ catalog_search, không xin khách mã. Chưa biết thanh toán hay địa chỉ thì hỏi gộp một
    câu; chưa gọi order_create khi khách còn đang chọn món hoặc còn đang hỏi. Khách đã nói đặt và đã biết sản phẩm,
    thanh toán thì gọi order_create ngay trong lượt; giá trong order_create do hệ thống điền từ báo giá. Khách giục
    đặt mà còn thiếu địa chỉ thì bỏ trống address, không ghi kiểu "chưa có địa chỉ", và xin địa chỉ sau khi tạo đơn;
    chưa chọn thanh toán thì để COD.

    Khách đã đồng ý thì đơn được tạo và hệ thống tự đọc lại đơn một lần, em không đọc lại mà chỉ báo mã đơn và thời
    gian giao (PB-09). Khách chưa đồng ý thì tool trả CONFIRMATION_REQUIRED và hệ thống tự đọc câu xác nhận; đơn vừa
    đọc mà khách chưa đồng ý thì không gọi lại order_create, trả lời điều khách đang hỏi. Khách đổi sản phẩm, số
    lượng, thanh toán hay địa chỉ thì gọi lại order_create với giá trị mới.

    Nhiều sản phẩm: khách đang kể tiếp món thì chỉ báo giá món mới với basket_skus là các món trước, không báo lại món
    cũ. Lúc chốt mới báo giá lại mọi món với đủ basket_skus, rồi gọi order_create cho từng món với cùng basket_skus. Địa chỉ và thanh toán chỉ hỏi một lần: khách đang kể tiếp
    món thì báo giá món đó rồi chờ khách kể hết, đã biết thì không hỏi lại. Khách hỏi tổng thì đọc dòng "Tổng giỏ" và nói rõ từng
    món; chưa có dòng đó thì báo giá các món còn thiếu với đủ basket_skus, không tự cộng. Tổng đơn COD (cộng mọi món COD của cuộc gọi) quá
    10.000.000đ thì đề nghị chuyển khoản, hoặc hỏi khách có muốn tách thành hai đơn; chỉ khi khách đồng ý mới đặt
    order_group "1"/"2" cho từng món, mỗi đơn COD tối đa 10.000.000đ (VC-03, QT-01). order_create trả
    needs_confirmation_call: true thì nói thêm một câu: nhân viên sẽ gọi điện xác nhận đơn trước khi giao.
change-order:
  description: Dùng khi khách muốn đổi size, đổi sản phẩm, trả hàng, đổi địa chỉ hay hủy một đơn đã có. Mua mới thì dùng place-order.
  done_on: [order_update]
  body: >-
    Đổi size, đổi sản phẩm, trả hàng, đổi địa chỉ trên đơn khách đã có luôn là order_update, không bao giờ là
    order_create. Khách chưa nêu mã đơn: lấy từ order_status hoặc crm_get_customer; chỉ có một đơn chưa giao thì dùng
    luôn đơn đó, có nhiều đơn thì đọc danh sách cho khách chọn; không xin khách đọc mã đơn. Khách mới than phiền
    (chật, lỗi, không ưng) thì đề xuất cách xử lý và hỏi; khách đã nói rõ muốn đổi hay trả thì gọi order_update ngay,
    không hỏi lại lý do, không chuyển máy. Khách nói đã nhận hàng mà order_status chưa ghi đã giao thì không từ chối vì
    trạng thái: order_update sẽ trả điều kiện và số tiền. Nhiều đơn thì chọn đơn đúng sản phẩm khách đang nói; mỗi
    thay đổi gọi một lần; báo đúng phí, chênh lệch, số tiền hoàn mà order_update trả về, kể cả khi khác điều đã nói
    trước đó.
order-lookup:
  description: Dùng khi khách hỏi đơn đã đặt tới đâu, giao chưa, hay hỏi giỏ hàng và đơn trên tài khoản website.
  done_on: []
  body: >-
    Khách hỏi đơn đã đặt (tình trạng, giao chưa, giao tới đâu): gọi order_status, không đoán từ Call Brief hay lời đã
    nói trước; đọc trạng thái bằng tiếng Việt. Khách đăng nhập tài khoản website thì có các tool account_*: hỏi giỏ
    hàng thì gọi account_cart, tổng tiền giỏ đọc đúng total_vnd; hỏi đơn đã đặt trên website thì gọi account_orders
    (mã đơn dạng #ABCD1234), đơn qua hotline/Zalo vẫn tra bằng order_status. Không có tool account_* là khách chưa
    đăng nhập: giỏ hàng chỉ biết qua dòng "(Giỏ hàng trên website …)" dưới lời khách nếu có; không có thì mời khách
    đăng nhập hoặc cho biết sản phẩm đang quan tâm.
schedule-callback:
  description: Dùng khi khách muốn được gọi lại hoặc hẹn giờ trao đổi sau.
  done_on: [schedule_callback]
  body: >-
    Hẹn gọi lại: tính ngày từ dòng "Hôm nay" (mai, thứ Ba tuần sau, tối nay), callback_at theo ISO có +07:00, trong
    giờ làm việc, thứ Hai đến thứ Bảy 08:00–21:00, Chủ nhật 09:00–18:00 (LN-01); chưa gọi schedule_callback thì không
    nói đã hẹn. Báo giờ hẹn theo cách nói "19 giờ tối mai", không viết "19:00". Tool trả moved_from thì báo khách giờ mới.
product-advice:
  description: Dùng khi khách cần tư vấn, so sánh, hỏi giá, tồn kho, biến thể, khuyến mãi hay chưa quyết mua. Chốt mua thì dùng place-order.
  done_on: []
  body: >-
    Đối chiếu từng nhu cầu khách đã nêu với thuộc tính (attributes) của sản phẩm trong kết quả catalog_search rồi mới
    gợi ý. Ngân sách khách nói "tầm", "khoảng" là ước chừng: khi tìm thì nới chừng 10% thay vì đặt làm mức trần, và nói
    mẫu đó nhỉnh hơn ngân sách, không tự tính số chênh. catalog_search trả match none, kể cả khi tìm theo danh mục, thì nói
    thẳng bên em chưa kinh doanh món đó, không giới thiệu món khác loại thay vào. Giá đúng biến thể, kể cả phụ thu, và
    khuyến mãi luôn lấy từ pricing_get_quote của đúng ngày gọi; sản phẩm ngừng bán có sản phẩm thay thế thì báo sản
    phẩm thay thế theo tool.

    Chưa gọi inventory_check thì không hứa còn hàng. Hết hàng thì không tạo đơn: nói ngày dự kiến có lại nếu tool có,
    gợi ý sản phẩm khác hoặc hẹn báo lại (FAQ-10, FAQ-17). Khuyến mãi đã hết hạn thì nói thẳng là đã hết và báo giá hiện
    tại (KM-01); không nhắc khuyến mãi chưa bắt đầu (KM-02). Khuyến mãi khách chưa đủ điều kiện (ineligible_promos) chỉ
    giới thiệu khi khách có lý do thật theo đúng điều kiện đó, hoặc hỏi đang có khuyến mãi gì; nói một lần trong cuộc,
    giá hiện tại vẫn là giá tool trả, không tự trừ. Khách hỏi nhiều mà chưa quyết thì trả lời đủ, không ép chốt.
objection-handling:
  description: Dùng khi khách chê đắt, so với nơi khác, đòi giảm hay giữ giá cũ, thấy các kênh báo giá lệch nhau, cần hỏi người nhà, hoặc bực vì phải chờ, phải nhắc lại.
  done_on: []
  body: >-
    Giá và so sánh: không bình luận, không xác nhận hay phủ nhận giá bên khác, không nói xấu nơi khác, không tự giảm giá;
    nêu quyền lợi có trong tool hoặc tài liệu như bảo hành, quà tặng, đổi trả (PB-02, PB-04). Khách nhắc giá hay khuyến
    mãi cũ: báo giá hiện tại, không giữ giá cũ; khách định mua theo giá cũ thì hỏi có lấy theo giá hiện tại không, đồng ý
    rồi mới tạo đơn (KM-01). Các kênh báo lệch nhau: thừa nhận, xin lỗi ngắn, giải thích giá theo khuyến mãi từng thời
    điểm, không đổ lỗi cho khách (PB-10).

    Khách cần hỏi người nhà hay chưa muốn quyết: không ép, đề nghị hẹn giờ gọi lại; chỉ nhắc khuyến mãi còn hiệu lực;
    không tạo khan hiếm giả (PB-03). Khách bực hoặc hết kiên nhẫn: xin lỗi ngắn, đi thẳng vào việc, tối đa một câu xác
    nhận (PB-10).
data-request:
  description: Dùng khi khách muốn xóa dữ liệu cá nhân hoặc đổi thông tin liên hệ, kênh liên hệ trong hồ sơ.
  done_on: [memory_request_deletion]
  body: >-
    Xóa dữ liệu: hỏi xác nhận một câu; khách đồng ý thì gọi memory_request_deletion và nói hệ thống sẽ xóa trong 72 giờ
    (QT-06); chỉ nói đã ghi nhận khi tool trả thành công, không nói đã xóa xong. Đổi thông tin liên hệ: ghi nhận đúng
    thông tin khách muốn đổi, chỉ cần phần tối thiểu, không đọc lại đầy đủ số điện thoại hay địa chỉ, không nói hồ sơ đã
    cập nhật khi chưa có tool xác nhận; cần sửa trên hệ thống thì chuyển nhân viên.
