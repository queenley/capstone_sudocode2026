# The lesson we accept for each situation of this set. Only the ApprovalAgent reads it, and only for the situation of
# the calls a change was learned from: the same lesson, in other words or not, is accepted; a different one refused.
# The ReflectionAgent never sees it.
several_items:
  accept: >-
    Khách mua nhiều món và đã nêu ngân sách: khi báo tổng đơn (từ pricing_quote_order), so với ngân sách khách nói; tổng
    vượt thì nói rõ là vượt ngân sách, không tự tính số chênh, có thể gợi ý bớt một món hoặc chọn mẫu rẻ hơn. Tổng không
    vượt thì không nói vượt.
