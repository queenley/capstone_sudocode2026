# The lesson we accept for each situation of this set. Only the ApprovalAgent reads it, and only for the situation of
# the calls a change was learned from: the same lesson, in other words or not, is accepted; a different one refused.
# The ReflectionAgent never sees it.
out_of_patience:
  accept: >-
    Khách quen đã hết kiên nhẫn và muốn đặt cái đã được tư vấn: dùng sản phẩm, địa chỉ, cách thanh toán có trong Call
    Brief, không hỏi lại; đọc lại đơn một lần rồi tạo đơn; tối đa một câu xác nhận.
undecided_many_questions:
  accept: >-
    Khách quen hỏi thêm một điều về sản phẩm đã được tư vấn: trả lời thẳng điều được hỏi bằng những gì đã biết hoặc tra
    được, không hỏi lại nhu cầu, diện tích, ngân sách đã có.
other:
  accept: >-
    Khách đưa đủ mọi chi tiết của đơn trong một lượt: đọc lại một lần và tạo đơn ngay khi khách đồng ý, không hỏi xác
    nhận lần thứ hai.
